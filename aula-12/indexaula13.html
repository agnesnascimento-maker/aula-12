<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entendendo o display</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Entendendo o display</h1>

    <p>
        O <strong>display</strong> define como um elemento se comporta na página.
    </p>

    <!-- BLOCK -->
    <h2>1. block</h2>
    <div class="block">Caixa 1</div>
    <div class="block">Caixa 2</div>
    <div class="block">Caixa 3</div>

    <!-- INLINE -->
    <h2>2. inline</h2>
    <span class="inline">Caixa 1</span>
    <span class="inline">Caixa 2</span>
    <span class="inline">Caixa 3</span>

    <!-- INLINE-BLOCK -->
    <h2>3. inline-block</h2>
    <div class="inline-block">Caixa 1</div>
    <div class="inline-block">Caixa 2</div>
    <div class="inline-block">Caixa 3</div>

</body>
</html>
